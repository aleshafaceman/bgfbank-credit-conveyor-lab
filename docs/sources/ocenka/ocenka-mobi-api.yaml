swagger: '2.0'
info:
  version: '2026-01-28'
  title: 'Мобильный Оценщик: API'
  contact:
    email: api@ocenka.mobi
  description: >
    Здесь вы можете найти документацию веб-сервисов аналитики недвижимости
    [Мобильного Оценщика](https://ocenka.mobi), а также попробовать их в работе.


    Обратите внимание, что для доступа к API необходимо получить ключ, однако
    вы можете *попробовать с тестовым ключом прямо сейчас*, нажав на кпопку `Authorize` ниже.
    
    
    После ввода ключа нажимайте кнопку `Try it out` в интересующем вас методе, чтобы ввести параметры и вызвать метод (кнопкой `Execute`). Документация по модели возвращаемого ответа показывается при нажатии `Model` в описании кода ответа `200` для каждого метода.
    
host: api.gate.ocenka.mobi
basePath: /v1
schemes:
  - https
tags:
  - name: Жилая недвижимость
    description: 'Сервисы по аналитике, поиску и оценке жилой недвижимости'
  - name: Информация
    description: Поиск информации по объектам недвижимости
  - name: Аналитика
    description: Аналитическая информация по рынку недвижимости и инфраструктуре
paths:

  /appraise/flat:
    get:
      tags:
        - Жилая недвижимость
      summary: Экспресс-оценка квартир
      description: >
        Оценка рыночной стоимости, информация по квартире, дому и окружению по одному лишь адресу квартиры. Передача доп. параметров уточняет результат, но необязательна.
      parameters:
        - name: address
          in: query
          description: >
            Адрес здания в любом формате, позволяющем точно идентифицировать
            дом.

            При вызове нужно передать либо адрес `address`, либо координаты `lat`, `lng`.
          required: false
          type: string
          default: 'Кострома, проспект Мира, 15'
        - name: lat
          in: query
          description: Широта
          required: false
          type: number
          format: double
          default: 55.676059
          minimum: 40
          maximum: 75
        - name: lng
          in: query
          description: Долгота
          required: false
          type: number
          format: double
          default: 37.536742
          minimum: 19
          maximum: 179
        - name: area
          description: >-
            Площадь объекта в кв.м, если указано, поиск производится среди
            квартир с площадью +-20% от указанной
          in: query
          required: false
          type: number
          format: double
          minimum: 10
          maximum: 1000
        - name: rooms
          description: >-
            Кол-во комнат, `4` означает "*4 и более*"'. Если указан этот параметр,
            то при подброре аналогов предпочитаются квартиры с тем же кол-вом комнат.
          in: query
          required: false
          type: string
          enum:
            - '1'
            - '2'
            - '3'
            - '4'
            - своб
        - name: maxFloor
          description: Этажность здания
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 200
        - name: floor
          description: Этаж расположения квартиры
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 200
        - name: bldYear
          description: Год постройки
          in: query
          required: false
          type: integer
          minimum: 1700
        - name: bldType
          description: Тип дома
          in: query
          required: false
          type: string
        - name: forceFlat
          description: >-
            В обязательном порядке производить поиск информации по квартире в Росреестре (по умолчанию - только если не передана площадь `area`).

            Очевидно, это работает, только если в адресе `address` *указан* номер квартиры.
          in: query
          required: false
          type: string
          default: 'false'
          enum:
            - '0'
            - '1'
            - 'false'
            - 'true'
        # - name: includeAds
        #   description: >-
        #     Включать ли объявления-аналоги, по которым расчитывалась стоимость, в возвращаемый результат.
        #   in: query
        #   required: false
        #   type: string
        #   default: 'false'
        #   enum:
        #     - '0'
        #     - '1'
        #     - 'false'
        #     - 'true'
      produces:
        - application/json
      security:
        - api_key: []
      responses:
        '404':
          description: Не найден указанный адрес
        '429':
          description: Превышен лимит запросов. Необходимо повторить запрос позже.
          schema:
            $ref: '#/definitions/ErrorResult'
        '504':
          description: Запрос слишком сложный или сервер занят. Необходимо сообщить в службу поддержки support@ocenka.mobi
          schema:
            $ref: '#/definitions/ErrorResult'
        '200':
          description: Результат экспресс-оценки квартиры, с информацией по зданию и аналогами, используемыми для расчета.
          schema:
            type: object
            properties:
              bld:
                $ref: '#/definitions/BldSearchResult'
              # flat:
              #   $ref: '#/definitions/FlatSearchResult'
              # ads:
              #   description: >-
              #     Выборка объявлений о продаже квартир в аналогичных зданиях,
              #     на основании которой расчитывался результат оценки.
              #     Присутствует, если при вызове передан параметр `includeAds={'1', 'true'}`
              #   type: array
              #   minItems: 1
              #   items:
              #     $ref: '#/definitions/AdSearchResult'
              stats:
                description: >-
                  Средние цены кв.м квартир в домах различного типа. Если
                  объявлений в указанном районе не найдено, будет возвращён
                  пустой массив.
                type: object
                properties:
                  quality:
                    type: string
                    description: >-
                      Индикатор качества подбора аналогов в выборке.
                      Качество `A` означает, что все подобранные аналоги совпадают с объектов оценки по всем параметрам.
                      Качество `B` означает, что в выборке есть аналоги, отличающиеся от объекта по одному параметру (например, этажности), `C` - по двум параметрам, и т.д.
                      Качество, отличное от `A`, означает, что результат оценки нужно использовать с осторожностью, т.к. аналоги не полностью идентичны объекту оценки.
                    enum:
                      - 'A'
                      - 'B'
                      - 'C'
                      - 'D'
                      - 'E'
                      - 'F'
                    example: A
                  price:
                    description: Экспресс-оценка стоимости квартиры (если была передана или определена площадь), на основе `stats.median` или `stats.average`, округляется до тысяч.
                    type: integer
                  priceRange:
                    type: array
                    description: Диапазон стоимости квартиры (если была передана или определена площадь), на основе квартилей `stats.q1/q3`, округляется до тысяч.
                    items:
                      type: number
                      format: double
                      minItems: 2
                      maxItems: 2
                  size:
                    description: Размер выборки
                    type: integer
                  median:
                    description:  >-
                      Медиана цены кв.м метра площади. Используйте в качестве
                      результата оценки при `size` >= 15
                    type: number
                    format: double
                  average:
                    description:  >-
                      Среднее цены кв.м метра площади. Используйте в качестве
                      результата оценки при `size` < 15
                    type: number
                    format: double
                  q1:
                    description: >
                      Первый [квартиль](https://ru.wikipedia.org/wiki/%D0%9A%D0%B2%D0%B0%D0%BD%D1%82%D0%B8%D0%BB%D1%8C#.D0.9C.D0.B5.D0.B4.D0.B8.D0.B0.D0.BD.D0.B0_.D0.B8_.D0.BA.D0.B2.D0.B0.D1.80.D1.82.D0.B8.D0.BB.D0.B8) выборки.
                    type: number
                    format: double
                  q3:
                    description: Третий квартиль выборки. При хороших показателях качества выборки (`size > 20`, `spread < 20`) интервал `{q1, q3}` может использоваться в качестве наиболее вероятного диапазона цен.
                    type: number
                    format: double
                  min:
                    description: Минимальное значение выборки.
                    type: number
                    format: double
                  max:
                    description: Максимальное значение выборки.
                    type: number
                    format: double
                  spread:
                    description: Относительная ширина межквартильного размаха выборки `(q3 - q1) / q3` (если >20%, то выборка неоднородная, результат оценки нужно использовать с осторожностью).
                    type: number
                    format: double
                  minMaxSpread:
                    description: Относительная ширина разброса выборки (между min и max) размаха выборки `(max - min) / max`.
                    type: number
                    format: double
                  totalAdsCount:
                    description: Количество объявлений в радиусе `totalAdsRadius` с даты `totalAdsDt` вокруг объекта оценки. Может использоваться как мера развитости рынка в данном районе. `totalAdsCount < 100` свидетельствует о неразвитом рынке, `totalAdsCount > 1000` - о развитом.
                    type: integer
                    example: 956,
                  totalAdsDt:
                    type: string
                    format: date
                    description: Дата, с которой искались объявления (ISO-8601).
                    example: '2018-11-15T13:46:44.165Z'
                  totalAdsRadius:
                    type: integer
                    description: Радиус, в котором искались объявления.
                    example: 500
                  activeMarket:
                    type: boolean
                    description: Индикатор активного/неактивного рынка (в соответствии с которым применялись корректировки).
                  segment:
                    type: string
                    description: Сегмент рынка (в соответствии с которым применялись корректировки).
          examples:
            application/json: |-
              {
                "bld": {
                    "pos": {
                        "lat": 55.89346,
                        "lng": 37.624965
                    },
                    "address": "Москва, улица Корнейчука, 58А",
                    "bldTitle": "Жилой дом",
                    "maxFloor": 9,
                    "bldYear": 1979,
                    "bldProject": "1-515",
                    "wallMaterial": "панельные",
                    "floorMaterial": "железобетонные",
                    "bldType": "панель",
                    "basement": "бетонные столбы",
                    "isAlarm": false,
                    "alarmLink": "https://yandex.ru/",
                    "entranceCount": 6,
                    "elevatorCount": 6,
                    "flatsCount": 223,
                    "livingCount": 209,
                    "nonLivingCount": 14,
                    "facadeType": "соответствует материалу стен",
                    "roofType": "плоская из рулонных материалов",
                    "bldArea": 10685.5,
                    "bldLivingArea": 10445.5,
                    "bldNonLivingArea": 240,
                    "plotArea": 1226,
                    "linkReforma": "https://www.reformagkh.ru/myhouse/profile/view/7564137",
                    "linkPKK": "https://pkk5.rosreestr.ru/#text=77%3A2%3A2006%3A1019&type=5&app=search&opened=1",
                    "cadNum": "77:2:2006:1019",
                    "photos": [
                        "https://foto.ru/get/28292/237744466.1288/0_3b29a_14f75820_XL"
                    ],
                    "stations": [
                        {
                            "name": "Бибирево",
                            "comment": "Серпуховско-Тимирязевская линия",
                            "distance": 1900,
                            "type": "метро"
                        }
                    ],
                    "orgs": [
                        "Имидж красота стиль, салон красоты",
                        "Стоматология Семейных Скидок, сеть клиник"
                    ],
                    "quality": "success"
                },
                "flat": {
                  "cadNum": "77:02:0002006:3741",
                  "name": "квартира из 3 комнат",
                  "address": "г.МОСКВА, УЛИЦА КОРНЕЙЧУКА, дом 58A кв. 95",
                  "area": 60.5,
                  "floor": 6,
                  "cadCost": 8980296.32,
                  "dateCost": "2014-12-18"
                },                
                "stats": {
                  "size": 37,
                  "median": 49033.95,
                  "average": 47309.54864864865,
                  "stdDev": 6870.441888415386,
                  "variation": 0.14522315440884329,
                  "q1": 41127.35,
                  "q3": 51530.85,
                  "iqr": 10403.5,
                  "lowerFence": 25522.1,
                  'upperFence": 67136.1,
                  "min": 34262.7,
                  "max": 60102.7,
                  "spread": 0.20188877148349,
                  "minMaxSpread": 0.42993076850124873,
                  "totalAdsCount": 956,
                  "totalAdsDt": "2018-11-15T13:46:44.165Z",
                  "totalAdsRadius": 500
                },
                "sample": [...]
              }

  /analyze/flat:
    get:
      deprecated: true
      tags:
        - Аналитика
      summary: Ценовой профиль рынка продажи квартир
      description: >
        Возвращает средние цены продажи квартир в различных аналитических срезах (по  в районе
        около заданной точки (параметры ``lat``, ``lng``).
      parameters:
        - name: lat
          in: query
          description: Широта
          required: true
          type: number
          format: double
          default: 55.676059
          minimum: 40
          maximum: 75
        - name: lng
          in: query
          description: Долгота
          required: true
          type: number
          format: double
          default: 37.536742
          minimum: 19
          maximum: 179
        - name: radius
          in: query
          description: >-
            Радиус, в котором происходит поиск объявлений. Для анализа берутся
            2000 ближайших к заданной точке объектов.
          required: false
          type: integer
          default: 2000
          minimum: 1
          maximum: 20000
        - name: type
          in: query
          description: Тип рынка - вторичка (по умолчанию) или новостройки.
          required: false
          type: string
          default: вторичка
          enum:
            - новостройка
            - вторичка
        - name: dtMin
          description: >-
            Кол-во дней, за которые производится поиск объявлений (по умолчанию
            - полгода).
          in: query
          required: false
          default: 180
          type: integer
          minimum: 1
          maximum: 720
      produces:
        - application/json
      security:
        - api_key: []
      responses:
        '429':
          description: Превышен лимит запросов. Необходимо повторить запрос позже.
          schema:
            $ref: '#/definitions/ErrorResult'
        '504':
          description: Запрос слишком сложный или сервер занят. Необходимо сообщить в службу поддержки support@ocenka.mobi
          schema:
            $ref: '#/definitions/ErrorResult'
        '200':
          description: Перечень атрибутов квартир с ценовым профилем.
          schema:
            type: object
            properties:
              area:
                description: >-
                  Средние цены в квартирах различной площади. Если объявлений в
                  указанном районе не найдено, будет возвращён пустой массив.
                type: array
                minItems: 1
                items:
                  $ref: '#/definitions/PricingProfileSearchResult'
              floor:
                description: >-
                  Средние цены кв.м квартир в домах различной этажности. Если
                  объявлений в указанном районе не найдено, будет возвращён
                  пустой массив.
                type: array
                minItems: 1
                items:
                  $ref: '#/definitions/PricingProfileSearchResult'
              bldType:
                description: >-
                  Средние цены кв.м квартир в домах различного типа. Если
                  объявлений в указанном районе не найдено, будет возвращён
                  пустой массив.
                type: array
                minItems: 1
                items:
                  $ref: '#/definitions/PricingProfileSearchResult'
              rooms:
                description: >-
                  Средние цены в квартирах различной комнатности. Если
                  объявлений в указанном районе не найдено, будет возвращён
                  пустой массив.
                type: array
                minItems: 1
                items:
                  $ref: '#/definitions/PricingProfileSearchResult'
          examples:
            application/json: |-
              {
                area: [
                  {count: 485, category: ">100 кв.м", priceSqm: 364000},
                  {count: 134, category: "80-99 кв.м", priceSqm: 294000},
                  …],
                rooms: [
                  {count: 354, category: "4+", priceSqm: 343000},
                  {count: 642, category: "3", priceSqm: 282000},
                  …],
                floor: [
                  {count: 723, category: "17-22 эт.", priceSqm: 302000},
                  {count: 473, category: "10-16 эт.", priceSqm: 301000},
                  …],
                bldType: [
                  {count: 452, category: "монолит", priceSqm: 360000},
                  {count: 683, category: "кирпич", priceSqm: 244000},
                  …]
              }

  /search/bld:
    get:
      deprecated: true
      tags:
        - Информация
      summary: Справочная информация по зданиям (жилым домам)
      description: >
        Возвращает характеристики жилых домов.

        Поиск по координатам (параметры ``lat``, ``lng``) или адресу
        (``address``).

        При вызове должны быть переданы либо координаты, либо адрес.
      parameters:
        - name: lat
          in: query
          description: Широта
          required: false
          type: number
          format: double
          default: 56.371491
          minimum: 40
          maximum: 75
        - name: lng
          in: query
          description: Долгота
          required: false
          type: number
          format: double
          default: 37.534972
          minimum: 19
          maximum: 179
        - name: address
          in: query
          description: >
            Адрес здания, в любом формате, позволяющем точно идентифицировать
            дом.

            При вызове нужно передать либо адрес, либо координаты.
          required: false
          type: string
          default: 'Кострома, проспект Мира, 15'
        - name: fiasId
          in: query
          description: >-
            Guid дома в ФИАС (часто доступен, если адрес выбирается из
            справочника). Необязателен, но позволяет более точно найти данные по
            дому.
          required: false
          type: string
          default: 6a0bc7a3-80a2-48a9-96fb-81b2ada8156c
      produces:
        - application/json
      security:
        - api_key: []
      responses:
        '429':
          description: Превышен лимит запросов. Необходимо повторить запрос позже.
          schema:
            $ref: '#/definitions/ErrorResult'
        '504':
          description: Запрос слишком сложный или сервер занят. Необходимо сообщить в службу поддержки support@ocenka.mobi
          schema:
            $ref: '#/definitions/ErrorResult'
        '200':
          description: >-
            Параметры здания. Если поиск завершился неудачей, будет возвращён
            null.
          schema:
            $ref: '#/definitions/BldSearchResult'
          examples:
            application/json: |-
              {
                "pos" : {
                  "lat" : 56.869491,
                  "lng" : 53.177112
                },
                "address" : "Удмуртская Республика, Ижевск, 7-я Подлесная улица, 97",
                "bldTitle" : "Жилой дом",
                "maxFloor" : 18,
                "bldYear" : 2015,
                "bldProject" : "Индивидуальный проект",
                "wallMaterial" : "Смешанные",
                "floorMaterial" : "Железобетонные",
                "bldType" : "панель",
                "basement" : "Свайный",
                "isAlarm" : false,
                "alarmLink": "https://yandex.ru/",
                "entranceCount" : 2,
                "elevatorCount" : 4,
                "flatsCount" : 210,
                "bldArea" : 10816.9,
                "bldLivingArea" : 8551.4,
                "bldNonLivingArea" : 2265.5,
                "plotArea" : 14980.1,
                "linkReforma" : "https://www.reformagkh.ru/myhouse/profile/view/9110836",
                "linkPKK" : "http://pkk5.rosreestr.ru/#text=18%3A26%3A10066%3A1445&type=5&app=search&opened=1",
                "cadNum" : "18:26:10066:1445",
                "photos" : ["https://img-fotki.yandex.ru/get/64820/157621844.189/0_79a3_27ea0263_XL"],
                "stations" : [{
                    "name" : "Ижевский Государственный Технический Университет им. М.Т. Калашникова",
                    "distance" : 320,
                    "type" : "автобус, троллейбус, маршрутка"
                  }
                ],
                "orgs" : ["КЕМБРИДЖ, парк-отель", "Магазин автозапчастей", "Мебель-ДИС, торгово-производственная компания"]
              }
        '400':
          description: Не хватает или неправильный формат параметров
        '403':
          description: >-
