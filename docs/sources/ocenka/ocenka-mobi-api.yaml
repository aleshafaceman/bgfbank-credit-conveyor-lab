          description: Тип дома
          in: query
          required: false
          type: string
        - name: floorMin
          description: Минимальная этажность здания (по умолчанию - без ограничений)
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 200
        - name: floorMax
