          required: false
          type: number
          format: double
          minimum: 20
          maximum: 200
        - name: areaMax
          description: Максимальная площадь квартиры в кв.м
          in: query
          required: false
          type: number
          format: double
          minimum: 20
          maximum: 200
        - name: rooms
          description: 'Кол-во комнат, `4` означает "*4 и более*"'
