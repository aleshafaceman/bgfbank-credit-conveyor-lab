  /find/auto:
    get:
      tags:
        - Информация
      summary: Поиск информации по авто
      description: >
        Возвращает характеристики транспортного средства.
      parameters:
        - name: vin
          in: query
          description: >
            VIN или № кузова транспортного средства.
          required: true
          type: string
        - name: type
          in: query
          description: >-
            База для поиска информации.
              
            * `gibdd_additional` - ГИБДД история регистрационных действий
            
            * `gibdd.restrict` - ГИБДД ограничения
            
            * `gibdd.dtp` - ГИБДД ДТП
            
            * `gibdd.wanted` - ГИБДД розыск
            
            * `rsa` - НСИС полисы ОСАГО
            
            * `reestr` - Реестр залогов ФНП
            
            * `elpts` - ЭПТС
          required: true
          type: string
          enum:
            - 'gibdd_additional'
            - 'gibdd.restrict'
            - 'gibdd.dtp'
            - 'gibdd.wanted'
            - 'rsa'
            - 'reestr'
            - 'elpts'
          default: 'gibdd.dtp'
      produces:
        - application/json
      security:
        - api_key: []
      responses:
        '429':
          description: Превышен лимит запросов. Необходимо повторить запрос позже.
          schema:
            $ref: '#/definitions/ErrorResult'
        '500':
          description: Не удалось получить информацию из источника в течение отведенного на запрос времени.
          schema:
            $ref: '#/definitions/ErrorResult'
        '400':
          description: Не хватает или неправильный формат параметров.
        '403':
          description: >-
            Не передан или неверный ключ Api. Передавайте его в заголовке `X-Api-Key:`.
        '200':
          description: >-
            Параметры ТС. Если источник информации недоступен, будет возвращен `null`.
          schema:
            $ref: '#/definitions/FindAutoResult'

securityDefinitions:
  api_key:
    description: >
      **API ключ.**


      Скопируйте тестовый ключ
      **``KaC7RJTWvm3iYV3d6rPpn2DWrC2SjZHQ5Lx6bhYx``** в поле `Value` ниже и 
      нажмите **Authorize**.
      

      Внимание: для тестового ключа действуют лимиты как на количество запросов с одного IP
      (независимо от ключа), так и на количество запросов с одним ключом в
      единицу времени (независимо от IP). 

      
      Обратитесь в [службу поддержки](mailto:api@ocenka.mobi) для получения ключа, пригодного для промышленной эксплуатации.
    type: apiKey
    name: X-Api-Key
    in: header
