        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /inspections:
    post:
      tags:
        - Осмотры
      summary: Создание нового осмотра
      requestBody:
        description: Параметры создаваемого осмотра.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  $ref: '#/components/schemas/Customer'
                schemaId:
                  type: string
                  pattern: '/^[a-f0-9]{24}$/'
                  description: ID схемы осмотра. Если не указано, схема будет назначена в зависимости от параметров имущества `params`.
                  example: 54d4dc91e4b06bea5261cc95
                params:
