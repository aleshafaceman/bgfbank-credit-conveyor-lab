            type: string
          required: true
      requestBody:
        description: Данные пользователя для изменения.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >-
                    ФИО пользователя, строго сначала фамилия, потом имя, потом
                    опционально отчество
                  example: Баландин Михаил Дмитриевич
                roles:
                  type: array
                  description: >-
                    Роли пользователя пользователя
                  items:
                    type: string
                    enum:
                      - сотрудник
