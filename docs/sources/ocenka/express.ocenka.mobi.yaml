    Appraiser:
      description: Оценочная компания
      type: object
      properties:
        _id:
          description: ID компании
          example: '5afed44ee745c534df69f79a'
          type: string
        name:
          description: Наименование компании
          example: Эксперт-оценщик
          type: string
        createdAt:
          description: Дата регистрации компании
          example: '2020-02-13T08:42:52.699Z'
          type: string
          format: date-time
        tos:
          description: Условия предоставления услуг
          example: Стоимость оценки - 1000 руб
          type: string
        notificationContact:
          $ref: '#/components/schemas/AppraiserNotificationContact'
        regions:
          description: Регионы и/или города, в которых работает компания
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AppraiserLocationSchema'
        recipients:
          description: Банки, в которых аккредитована оценочная компания.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrgWithDept'
        legalName:
          description: (для оплаты услуг) Юрлицо компании
          example: 'ООО "Эксперт-оценщик"'
          type: string
        inn:
          description: (для оплаты услуг) ИНН компании
          example: '7734215210'
          type: string
        kpp:
          description: (для оплаты услуг) КПП компании
          example: '770101001'
          type: string
        paymentBank:
          description: (для оплаты услуг) Банк компании
          example: 'БАНК ВТБ (ПАО)'
          type: string
        paymentBIK:
          description: (для оплаты услуг) БИК банка компании
          example: '044525187'
          type: string
        paymentCorrAcc:
          description: (для оплаты услуг) Корсчет в банке компании
          example: '30101810700000000187'
          type: string
        paymentAccount:
          description: (для оплаты услуг) Расчетный счет в банке компании
          example: '40702810000000181291'
          type: string
      required:
        - _id
        - name
        - createdAt
    
    AppraiserNotificationContact:
      description: Контактные данные оценочной компании
      type: object
      properties:
        name:
          description: ФИО контактного лица
          example: 'Пупкин Василий Иванович'
          type: string
        email:
          description: Контактный имейл
          example: 'super@ocenka.com'
          type: string
        phone:
          description: Контактный телефон
          example: '+79001234567'
          type: string

    OrderStatusChangeSchema:
      description: Измение статуса заказа.
      type: object
      properties:
        status:
          description: Новый статус заказа. Опциальный параметр (по умолчанию равен текущему).
          $ref: '#/components/schemas/OrderStatus'
          example: completed
        desc:
          description: Комментарий (в т.ч. к изменению статуса). Опциональный параметр, если не передан, то Комментарий будет сформирован автоматически на основе `status`.s
          example: 'Оценщик приступил к подготовке отчёта'
          type: string

    OrderAttachmentChangeSchema:
      description: Измение прикрепленных к заказу документов.
      type: object
      properties:
        attachment:
          description: Изменённый набор прикреплённых фото и документов
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/File'

    OrderPropsChangeSchema:
      description: Изменение некоторых свойств заказа.
      type: object
      properties:
        $set:
          type: object
          properties:
            'params.bankBranch':
              description: Тер. банк
              example: 'Байкальский банк'
              type: string
            'params.assetStatus':
              description: Статус имущества
              example: 'балансовое'
              type: string
            'params.inventoryNo':
              description: Инвентарный №
              example: '987987987'
              type: string
    
    AppraiserLocationSchema:
      description: Перечень регионов/городов.
      type: object
      properties:
        regionFiasId:
          type: string
          format: uuid
          description: ФИАС/ГАР ID субъекта федерации
          example: 18133adf-90c2-438e-88c4-62c41656de70
        regionName:
          type: string
          description: Наименование субъекта федерации
          example: Калужская обл
        areaFiasId:
          type: string
          format: uuid
          description: ФИАС/ГАР ID района
          example: 5d141523-a76d-448b-a3b8-2d6ddc56eee6
        areaName:
          type: string
          description: Наименование района
          example: Боровский р-н
        cityFiasId:
          type: string
          format: uuid
          description: ФИАС/ГАР ID города
          example: 0c66ce29-8464-40ef-a11d-e8e6df7475fd
        cityName:
          type: string
          description: Наименование города
          example: г Ермолино
      required:
        - regionFiasId
        - regionName
