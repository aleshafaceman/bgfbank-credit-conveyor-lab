openapi: 3.0.0
servers:
  - url: 'https://test.express.ocenka.mobi/api'
    description: Тестовый контур
  - url: 'https://express.ocenka.mobi/api'
    description: Продуктивный контур
  # - url: 'https://gost.express.ocenka.mobi/api'
  #   description: Продуктивный контур с GOST TLS
  - url: 'https://express.gost.ocenka.mobi/api'
    description: Продуктивный контур с GOST TLS и mTLS
externalDocs:
  url: 'https://api.ocenka.mobi/?url=express.ocenka.mobi.yaml'
  description: Ссылка на эту документацию
info:
  version: '2026-09-16'
  title: 'Мобильный Оценщик: Express API'
  contact:
    name: Служба поддержки разработчиков
    email: support@ocenka.mobi
  description: >
    Здесь вы можете найти документацию по интеграционным веб-сервисам
    приложения [Мобильный Оценщик: Экспресс-Оценка](https://express.ocenka.mobi).


    Обратите внимание, что для доступа к API необходимо получить
    [JWT-токен](https://jwt.io/) с помощью метода `/auth/login`, и передавать
    его в остальных методах в заголовке `Authorization: Bearer <token>`.


    Документация по модели возвращаемого ответа показывается при нажатии
    **Model** в описании кода ответа `20x` для каждого метода.


    На частоту запросов к API установлены ограничения: **не более 200 запросов в течение 10 минут**.
    Запросы, превышающие этот лимит, будут замедляться пропорционально величине превышения.

    В ответах API присутствуют информационные заголовки:
    
    * `X-SlowDown-Limit`: Текущий лимит запросов

    * `X-SlowDown-Remaining`: Оставшийся лимит запросов до активации замедления. По этому значению рекомендуется принимать решение о том, когда делать следующий запрос.

    * `X-Slowdown-Reset`: Время ([Unix epoch](https://en.wikipedia.org/wiki/Unix_time)) обнуления счетчика запросов.


    Рекомендуемый алгоритм работы: вы создаете запрос на оценку, потом мониторите по `_id` статус его готовности. По готовности - забираете результаты. 
    То есть у вас есть очередь неготовых запросов, по которым вы проверяете статус. Обрабатывайте эту очередь **последовательно**, с интервалом **5 секунд**.


    Лимит рассчитан на 100 запросов: Вы отправляете 100 запросов (1 запрос в секунду, итого 100 запросов за ~2 минуты),
    у вас получается очередь из 100 неготовых запросов, и вы их проверяете за 100 * 5 сек = ~8 минут. В сумме 200 запросов за 10 минут, лимит не превышен.

    Если у вас будет единовременно более 100 неготовых запросов, обратитесь в службу поддержки для повышения лимита.
    

    Вы можете вызывать методы API прямо из этой документации:

    1) Узнайте имейл/пароль действующего сотрудника в вашей организации или
    запросите их у службы поддержки.

    2) Выполните метод `/auth/login`, нажав кнопку **Try it out** в его
    документации. Передайте имейл/пароль согласно схеме.

    3) Сохраните полученный токен, возвращённый методом `/auth/login`, нажав кнопку **Authorize**.

    4) Теперь вы можете вызывать остальные методы API, нажимая кнопку **Try it
    out** в интересующем вас методе, чтобы раскрыть форму параметров и вызвать
    метод (кнопкой **Execute**). 


    Документация обновляется и дополняется, дату
    последнего обновления вы можете видеть в заголовке.

tags:
  - name: Аутентификация
    description: Методы аутентификации и авторизации
  - name: Пользователи
    description: Методы работы с пользователями
  - name: Запросы на экспресс-оценку
    description: Сервисы по созданию и просмотру запросов на экспресс-оценку (верификацию стоимости)
  - name: Заказ отчётов
    description: Сервисы по созданию и просмотру заказов на создание отчётов об оценке
  - name: Файловое хранилище
    description: Сервисы по загрузке и получению файлов из защищённого файлового хранилища
  - name: Осмотры
    description: Создание осмотров имущества

paths:
  /auth/login:
    post:
      tags:
        - Аутентификация
      summary: Получение токена для использования API
      deprecated: true
      description: Метод устарел и существует ограниченное время для обратной совместимости. В интеграционных сценариях следует использовать **Client Credentials Grant** на сервере [auth.ocenka.mobi](https://auth.ocenka.mobi/oidc/.well-known/openid-configuration), получив предварительно реквизиты для доступа.
      requestBody:
        description: Реквизиты для входа. Для продуктивного и тестового контура используются одни и те же реквизиты.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Имейл
                  example: nice@domain.com
                password:
                  type: string
                  format: password
                  description: Пароль
                  example: 'MySecret#$%33'
                scope:
                  type: string
                  description: Запрашиваемые права доступа. Для получения рабочего токена необходимо передать значение `org express`.
                  enum:
                    - org express
                  example: org express
      responses:
        '200':
          description: Успешная аутентификация и авторизация.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_token:
                    type: string
                    description: >
                      Авторизационный JWT-токен. Передавайте его в заголовке
                      `Authorization: Bearer <id_token>` для доступа к остальным
                      методам API.

                      Если [декодировать токен](https://jwt.io/libraries), то из [claimа
                      `exp`](https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.4)
                      можно взять срок окончания его действия (порядка нескольких дней).
                      Настоятельно рекомендуется кэшировать полученный токен,
                      и переиспользовать его до окончания срока действия, т.к.
                      имеются лимиты на количество авторизаций в единицу времени (`HTTP 429`).

                      По окончании срока действия (симптом - методы API начнут
                      отдавать `HTTP 401`) нужно получить новый токен.

                      Наличие токена ещё не означает его валидность, т.к. в
                      токене потенциально могут отсутствовать запрошенные
                      `scope`ы для доступа к API (напр. пользователь
                      зарегистрирован, но у него нет прав на доступ к
                      определенному API - `HTTP 403`).
                  token_type:
                    type: string
                    description: Тип токена
                    enum:
                      - Bearer
                example:
                  id_token: >-
                    eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6InRlbXBsYXRldGVzdEBvY2Vua2EubW9iaSIsImVtYWlsX3ZlcmlmaWVkIjp0cnVlLCJuYW1lIjoi0KLQtdGB0YIg0KjQsNCx0LvQvtC90LAiLCJvcmciOnsiX2lkIjoiNTlkMjJmYTY2OGY1OWEzNDQ1MDM3NzZjIiwibmFtZSI6ItCi0LXRgdGCINGI0LDQsdC70L7QvdCwINC-0YDQs9Cw0L3QuNC30LDRhtC40LgifSwiYXBwIjp7InJvbGVzIjpudWxsfSwiaXNzIjoiaHR0cHM6Ly9vY2Vua2Ftb2JpLmV1LmF1dGgwLmNvbS8iLCJzdWIiOiJhdXRoMHw1OWQyMzA1N2ZjMTc2ZjVjZWRhMjA1MjciLCJhdWQiOiJKNDZ6ZjJjQktBUlJFUmRMRnprWlRhMVdJeGlyU2JSeiIsImlhdCI6MTU0MjEyODkzMiwiZXhwIjoxNTQyNTYwOTMyfQ.truSvQYDlSCFmSmAASVH5dK1XA6sXAC4aEILPS-tSss
                  type: Bearer
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          description: 'Ошибка аутентификации, напр. из-за неверного пароля'
        '403':
          description: >-
            Недопустимый профиль пользователя, напр. с неподтверждённым emailом
            или неназначенной организацией.
        '429':
          description: IP-адрес заблокирован из-за многочисленных попыток аутентификации.
  
  /express:
    get:
      tags:
        - Запросы на экспресс-оценку
      summary: 'Получение списка запросов на экспресс-оценку, их фильтрация и поиск.'
      security:
        - bearerAuth: []
      parameters:
        - name: skip
          in: query
          description: Сколько записей пропустить
          schema:
            type: integer
            minimum: 0
          example: 100
        - name: limit
          in: query
          description: Начиная с какой записи вернуть список
          schema:
            type: integer
            maximum: 1000
          example: '0'
        - name: dtFrom
          in: query
          description: Минимальная дата создания запроса
          schema:
            type: string
            format: date-time
          example: '2018-10-29T17:43:00.000Z'
        - name: dtTo
          in: query
          description: Максимальная дата создания запроса
          schema:
            type: string
            format: date-time
          example: '2018-11-13T17:43:07.404Z'
        - name: status
          in: query
          description: Статус запросов. Можно передавать несколько статусов через запятую
          schema:
            type: string
            enum:
              - pending-auto
              - accepted
              - rejected
              - pending-control
              - cancelled
            example: pending-control
        - name: search
          in: query
          description: >-
            Подстрока для поиска, поиск происходит по адресу, номеру запроса,
            кад. №.
          schema:
            type: string
          example: Карамышевская
        - name: batch
          in: query
          description: 'Фильтрация запросов, отправленных в рамках пакета.'
          schema:
            type: string
            enum:
              - '1'
              - 'true'
              - '0'
              - 'false'
            example: '1'
        - name: files
          in: query
          description: 'Фильтрация запросов, имеющих прикреплённые файлы.'
          schema:
            type: string
            enum:
              - '1'
              - 'true'
              - '0'
              - 'false'
            example: '1'
      responses:
        '200':
          description: Список запросов
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: >-
                      Общее количество запросов, удовлетворяющих заданным
                      критериям поиска
                    example: 876
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Запросы на экспресс-оценку
      summary: Создание нового запроса на экспресс-оценку
      security:
        - bearerAuth: []
      parameters:
        - name: X-Client
          in: header
          description: >-
            Идентификатор и версия клиентского приложения, осуществляющего вызов
            API. Необходим для отладки (понимания, из какого клиента сделан вызов).

            Рекомендуемый формат: `<имя_клиента> <номер_версии>`.
            Например: `integration.bank.ru 6.8.1234`.
          schema:
            type: string
      requestBody:
        description: >-
          Входные параметры запроса на экспресс-оценку. Конкретная модель `params`
          зависит от типа рынка. См. https://l.ocenka.mobi/xOOzjd
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  $ref: '#/components/schemas/InputParams'
                to:
                  $ref: '#/components/schemas/OrgWithDept'
                batch:
                  type: boolean
                  default: false
                  description: Является ли запрос частью пакета (несколько запросов, отправленных автоматизированно). Позволяет избежать перегрузки при обработке большого количества запросов за короткий промежуток времени, которые без этого флага были бы пессимизированы из-за лимитов (см. выше).
              required:
                - params
      responses:
        '201':
          description: Запрос успешно создан. Возращается содержимое созданного запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  '/express/{id}':
    get:
      tags:
        - Запросы на экспресс-оценку
      summary: Получение информации по конкретному запросу на экспресс-оценку
      operationId: getRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID запроса
          required: true
          schema:
            type: string
        - name: concise
          in: query
          description: >
            При значении `true` в ответ не включаются занимающие много места поля: аналоги (`auto.result` и `control.result`),
            данные из отчёта об оценке `params.attachment[0].data`, сырые данные выписки ЕГРН `egrn.data`.
          required: false
          schema:
            type: string
            enum:
              - '1'
              - '0'
              - 'true'
              - 'false'
            default: 'false'
      responses:
        '200':
          description: Информация о запросе на экспресс-оценку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    put:
      tags:
        - Запросы на экспресс-оценку
      summary: Модификация запроса на экспресс-оценку
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID запроса
          required: true
          schema:
            type: string
      requestBody:
        description: >
          Изменяемые свойства. Схема зависит от того, какой именно *usecase*
          изменения реализуется.


          **Отмена контрольной верификации**:
          
          
          `
          {
            "cancelReason": "причина отмены"
          }
          `
          
          
          **Прикрепление документов** после создания запроса (предварительно загруженных, см. `GET /file/upload`):
          
          
          `
          {
            "params":
              {
                 "attachment": [{}, {}, ...]
              }
          }
          `
          
          
          **Отправка на повторную верификацию**:
          
          
          `
          {
            "control":
              {
                "newReq": true,
                 "controlReason": "причина повторной верификации"
              }
          }
          `
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Описание схемы для разных сценариев см. выше.
      responses:
        '200':
          description: Модифицированный запрос на экспресс-оценку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '204':
          description: Операция не изменит состояние запроса (запрошенное изменение уже было сделано ранее). В большинстве случаев означает, что используется не актуальное состояние запроса.
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  
  '/orders/appraisers':
    get:
      tags:
        - Заказ отчётов
      operationId: getAppraisers
      summary: 'Получение списка аккредитованных оценщиков'
      parameters:
        - name: bankId
          in: query
          description: ID организации-банка
          required: false
          schema:
            type: string
            example: 54d4dc91e4b06bea5261cc95
        - name: regionFiasId
          in: query
          description: ФИАС id (https://fias.nalog.ru/) субъекта РФ
          required: false
          schema:
            type: string
            format: uuid
            example: 18133adf-90c2-438e-88c4-62c41656de70
        - name: areaFiasId
          in: query
          description: ФИАС id (https://fias.nalog.ru/) района
          required: false
          schema:
            type: string
            format: uuid
            example: 5d141523-a76d-448b-a3b8-2d6ddc56eee6
        - name: cityFiasId
          in: query
          description: ФИАС id (https://fias.nalog.ru/) города
          required: false
          schema:
            type: string
            format: uuid
            example: 0c66ce29-8464-40ef-a11d-e8e6df7475fd
        - name: all
          in: query
          description: Если передано `1` или `true`, то будут возвращены все оценочные компании, подходящие под другие критерии, иначе - не более 20 штук.
          required: false
          schema:
            type: string
            enum:
              - '1'
              - '0'
              - 'true'
              - 'false'
            example: '1'
      responses:
        '200':
          description: >-
            Список аккредитованных оценщиков для указанного банка, работающих в указанном регионе/городе.
            Возвращается список из не более 20 компаний-оценщиков в случайном порядке (порядок меняется при каждом вызове)
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/Appraiser'
 
  /orders:
    post:
      tags:
        - Заказ отчётов
      summary: Создание нового заказа
      requestBody:
        description: >-
          Входные параметры запроса на экспресс-оценку. Конкретная модель `params`
          зависит от типа рынка. См. https://l.ocenka.mobi/xOOzjd
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  $ref: '#/components/schemas/OrderInputParams'
                customer:
                  $ref: '#/components/schemas/Customer'
                appraiser:
                  $ref: '#/components/schemas/Org'
                bank:
                  $ref: '#/components/schemas/OrgWithDept'
              required:
                - params
      responses:
        '201':
          description: Заказ успешно создан. Возращается содержимое созданного заказа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  
    get:
        tags:
          - Заказ отчётов
        summary: 'Получение списка заказов, их фильтрация и поиск.'
        security:
          - bearerAuth: []
        parameters:
          - name: skip
            in: query
            description: Сколько записей пропустить
            schema:
              type: integer
              minimum: 0
            example: 100
          - name: limit
            in: query
            description: Начиная с какой записи вернуть список
            schema:
              type: integer
              maximum: 1000
            example: '0'
          - name: dtFrom
            in: query
            description: Минимальная дата создания заказа
            schema:
              type: string
              format: date-time
            example: '2018-10-29T17:43:00.000Z'
          - name: dtTo
            in: query
            description: Максимальная дата создания заказа
            schema:
              type: string
              format: date-time
            example: '2018-11-13T17:43:07.404Z'
          - name: status
            in: query
            description: >-
              Статус заказов. Можно передавать несколько статусов через запятую.
              
              * `queued` - Черновик заказа. Заказ находится в очереди на обработку.
              
              * `confirmation` - Проверка заказа. Уточнение параметров заказа, выбор исполнителя, согласование с заказчиком.
              
              * `pre-inspection` - Подготовка к осмотру объекта оценки. Согласование исполнителя и даты осмотра.
              
              * `inspection` - Осмотр объекта оценки.
              
              * `pre-production` - Подготовка к оценке. Передача материалов в производство.

              * `appraisal` - В работе у оценщика.
              
              * `delivery` - Отчёт готов, согласование/доставка отчёта заказчику.
              
              * `completed` - Заказ выполнен.
              
              * `onhold` - Выполнение заказа отложено.
              
              * `cancelled` - Заказ отменён.
  
            schema:
              type: string
              enum:
                - queued
                - confirmation
                - pre-inspection
                - inspection
                - pre-production
                - appraisal
                - delivery
                - completed
                - onhold
                - cancelled
              example: completed
          - name: search
            in: query
            description: >-
              Подстрока для поиска, поиск происходит по адресу, номеру заказа,
              кад. №.
            schema:
              type: string
            example: 8-191023-121
          - name: appraiserId
            in: query
            description: 'id организации оценщика, выполнявшего заказ'
            schema:
              type: string
              pattern: '/^[a-f0-9]{24}$/'
              example: '5a9698c679d1c72b318f1a8d'
        responses:
          '200':
            description: Список заказов
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    total:
                      type: integer
                      description: >-
                        Общее количество заказов, удовлетворяющих заданным
                        критериям поиска
                      example: 876
                    result:
                      type: array
                      items:
                        $ref: '#/components/schemas/Order'
          '400':
            $ref: '#/components/responses/InvalidParamsError'
          '401':
            $ref: '#/components/responses/UnauthorizedError'
          '403':
            $ref: '#/components/responses/ForbiddenError'

  '/orders/{id}':
    get:
      tags:
        - Заказ отчётов
      summary: Получение информации по конкретному заказу
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID заказа
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация о заказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    put:
      tags:
        - Заказ отчётов
      summary: Изменение информации по заказу
      operationId: putOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID запроса
          required: true
          schema:
            type: string
      requestBody:
        description: Информация об изменении.
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OrderStatusChangeSchema'
                - $ref: '#/components/schemas/OrderAttachmentChangeSchema'
                - $ref: '#/components/schemas/OrderPropsChangeSchema'

      responses:
        '200':
          description: Изменённый заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '204':
          description: Операция не изменит состояние заказа (запрошенное изменение уже было сделано ранее). В большинстве случаев означает, что используется не актуальное состояние заказа.
        '400':
          $ref: '#/components/responses/InvalidParamsError'

  /users:
    get:
      tags:
        - Пользователи
      summary: Получение списка пользователей организации
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDetailed'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    
    post:
      tags:
        - Пользователи
      summary: Регистрация нового пользователя
      parameters:
        - name: X-Client
          in: header
          description: >-
            Идентификатор и версия клиентского приложения, осуществляющего вызов
            API. Необходим для отладки (понимания, из какого клиента сделан вызов).
            
            Рекомендуемый формат: `<имя_клиента> <номер_версии>`.
            Например: `integration.bank.ru 6.8.1234`.
          schema:
            type: string
      requestBody:
        description: Регистрационные данные пользователя.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >-
                    ФИО пользователя, строго сначала фамилия, потом имя, потом
                    опционально отчество
                  example: Баландин Михаил Дмитриевич
                email:
                  type: string
                  format: email
                  description: Имейл пользователя
                  example: bmd@enet.ru
                roles:
                  type: array
                  description: >-
                    Роли пользователя пользователя
                  items:
                    type: string
                    enum:
                      - сотрудник
                      - менеджер
                    example: менеджер
                dept:
                  description: >-
                    Подразделение пользователя. Для иерархии подразделения
                    рекомендуется использовать разделитель, напр. \"/\"
                  type: string
                  example: Воронеж/Розница
              required:
                - name
                - email
      responses:
        '201':
          description: >
            Пользователь успешно создан, но с `emailVerified: false`, то есть
            должен подтвердить свой email, пройдя по ссылке в отправленном ему
            письме.''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailed'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Пользователь с указаным `email` уже существует

  '/users/{userId}':
    get:
      tags:
        - Пользователи
      summary: Получение данных о пользователе
      parameters:
        - name: X-Client
          in: header
          description: >-
            Идентификатор и версия клиентского приложения, осуществляющего вызов
            API. Необходим для отладки (понимания, из какого клиента сделан вызов).
            
            Рекомендуемый формат: `<имя_клиента> <номер_версии>`.
            Например: `integration.bank.ru 6.8.1234`.
          schema:
            type: string
        - name: userId
          description: ID пользователя
