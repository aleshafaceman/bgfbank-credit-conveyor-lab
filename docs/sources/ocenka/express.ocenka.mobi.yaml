                - customer
      responses:
        '201':
          description: >
            Осмотр успешно создан.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Конфликтующие параметры осмотра, подробности в теле ответа.

  /file/upload:
    get:
      tags:
        - Файловое хранилище
      summary: Получение ссылки на загрузку (upload) файла
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          description: Имя файла (не urlenconded)
          required: true
          schema:
            type: string
          example: 'Выписка.pdf'
      # required:
      #   - path

        # - name: acl
        #   in: query
        #   description: >
        #     Тип доступа к загруженному файлу:
        #       * `public` - файл будет доступен всем без авторизации
        #       * `temp` - файл будет доступен всем без авторизации, но уничтожен через 24 часа
        #       * `private` - файл будет доступен только для сотрудников той же организации, к которой принадлежит автор запроса, по специальной ссылке, действующей ограниченный период времени.
        #   schema:
        #     type: string
        #     enum: 
        #       - public
        #       - temp
        #       - private
        #     default: private
        #   example: temp
      responses:
        '201':
          description: >
            Создана ссылка на загрузку файла.


            Процесс загрузки файла для добавления ко входным параметрам запроса на верификацию (`params.attachment`) следующий:


            1) вызываете метод `/file/upload`, передавая ему имя файла: `GET /file/upload?path=Документ.pdf`
            
            2) в ответ метод возвращает `{"url": "*******"}`, на этот `url` надо сделать запрос методом `PUT`, и в теле запроса передать файл (в заголовках поставить `Content-Type` в соответствии с типом файла)
            
            3) для получения ссылки для `params.attachment` отрежьте в `url` query string (начиная с `?` и дальше)
            
            4) добавьте в `params.attachment` элемент с описанием файла:
            
            
            ```
            
            {
              src: 'X-Client вашего приложения, напр. my.integration.ru 1234',
              url: "url с обрезанным query string, напр. https://storage.yandexcloud.net/om-express/591233768c842b0fb1412123/auth0%7C60e5c1236c9def00704dfd32/63978cc0d5898a123f9df1e4/out_docs.pdf",
              name: "имя файла, которое вы передавали в path, напр. Документ.pdf",
              size: 123456, // размер файла, байт
              type: "application/pdf", // MIME-тип файла
              modified: "2021-11-25T11:47:53.926Z" // текущая дата
            }

          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: >
                      Ссылка на загрузку файла.
                      Загрузку файла необходимо осуществить методом `PUT` на указанный `url`
                    example: 'https://file.storage.ru/tmp/5cf514474b5f/b2e777c42a2cdc.pdf'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /file/download:
    get:
      tags:
        - Файловое хранилище
      summary: Получение ссылки на скачивание (download) файла, для скачивания файлов.
      security:
        - bearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          description: Ссылка на файл, который нужно скачать.
          schema:
            type: string
            format: uri
      # required:
      #   - url
      responses:
        '200':
          description: >
            Ссылка на загрузку файла.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Ссылка на скачивание файла.
                    example: 'https://file.storage.ru/tmp/5cf514474b5f/b2e777c42a2cdc.pdf?temp_url_expires=1565874600&filename=%D0%92%D1%8B%D0%BF%D0%B8%D1%81%D0%BA%D0%B0.pdf&temp_url_sig=ea244679c34cd688c5223a4a356a86a612d9f502'
        '400':
          $ref: '#/components/responses/InvalidParamsError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
 
  responses:
    UnauthorizedError:
      description: 'Ошибка аутентификации, напр. отсутствующий или невалидный JWT-токен'
 
    InvalidParamsError:
      description: Переданы неверные параметры. Подробности в теле ответа.
      content:
        'text/html':
          schema:
            type: string
            example: '"params" is required'
 
    ForbiddenError:
      description: >-
        Доступ к API для переданного JWT-токена не
        предоставляется. Возможно, аккаунт не имеет доступа к express.ocenka.mobi (можно узнать на support@ocenka.mobi),
        или токен был получен из `/auth/login` без использования `scope: "org express"`.
 
  schemas:
    Org:
      description: Организация
      type: object
      properties:
        _id:
          type: string
          description: ID организации
          example: 54d4dc91e4b06bea5261cc95
        name:
          type: string
          description: Название организации
          example: Рога и Копыта, ООО
      required:
        - _id
        - name

    OrgWithDept:
      description: Организация с подразделением
      type: object
      properties:
        org:
          $ref: '#/components/schemas/Org'
        dept:
            type: string
            description: Подразделение в организации
            example: Ипотека
      required:
        - org

    Customer:
      description: Клиент, авторизованный по № телефона
      type: object
      properties:
        _id:
          type: string
          description: ID пользователя (если он уже создавался)
          example: 'auth|5b2b7521be377759a4ffca99'
        name:
          type: string
          description: ФИО пользователя
          example: Баландин Михаил Дмитриевич
        phone:
          type: string
          format: phone
          description: Мобильный телефон пользователя
          example: '+79080001751'
      required:
        - name
        - phone

    UserShort:
      description: Пользователь (краткая информация)
      type: object
      properties:
        _id:
          type: string
          description: ID пользователя
          example: auth|5b2b7521be377759a4ffca99
        name:
          type: string
          description: ФИО пользователя
          example: Баландин Михаил Дмитриевич
        email:
          type: string
          format: email
          description: Имейл пользователя
          example: bmd@enet.ru
        org:
          $ref: '#/components/schemas/Org'
      required:
        - _id
        - name
        - email
        - org

    UserDetailed:
      description: >-
        Пользователь (подробная информация). В дополнение к указанным свойствам
        профиль дополняется свойствами, специфичными для конкретного приложения.
      type: object
      properties:
        active:
          type: boolean
          description: Активный или заблокированный
          example: true
        avatar:
          type: string
          format: uri
          description: URL аватарки
          example: 'https://s.gravatar.com/avatar/e6221a163e45c6ca3ba175c986af8a47?s=480'
        createdAt:
          format: date-time
          description: Дата регистрации пользователя
          example: '2018-11-13T17:43:07.404Z'
        name:
          type: string
          description: ФИО пользователя
          example: Баландин Михаил Дмитриевич
        email:
          type: string
          format: email
          description: Имейл пользователя
          example: bmd@enet.ru
        emailVerified:
          type: boolean
          description: Подтверждён ли имейл
          example: true
        lastLoginAt:
          format: date-time
          description: Дата последней авторизации пользователя
          example: '2018-11-13T17:43:07.404Z'
      required:
        - active
        - createdAt
        - emailVerified
        - email
        - name

    File:
      description: Внешний файл
      type: object
      properties:
        src:
          type: string
          description: Идентификатор приложения, создавшего/загрузившего файл (см. описание заголовка `X-Client`)
          example: 'ABS 4.0.1'
        caption:
          type: string
          description: Наименование (категория) файла
          example: ЭЦП
        type:
          type: string
          description: MIME-тип файла
          example: application/zip
        url:
          type: string
          format: uri
          description: >-
            URL для скачивания файла, обычно работает в течение ограниченного
            времени (напр. 15 минут)
        size:
          type: integer
          description: 'Размер файла, байт'
          example: 34454939
        name:
          type: string
          description: Имя файла
          example: Отчёт.pdf.sig
        modified:
          type: string
          format: date-time
          description: Время создания файла
          example: "2021-11-25T11:47:53.926Z"
      required:
        - type
        - url
        - size
        - name

    FileExt:
      description: Внешний файл с дополнительной информацией
      type: object
      properties:
        caption:
          type: string
          description: Наименование (категория) файла
          example: ЭЦП
        type:
          type: string
          description: MIME-тип файла
          example: application/zip
        url:
          type: string
          format: uri
          description: >-
            URL для скачивания файла, обычно работает в течение ограниченного
            времени (напр. 15 минут)
        size:
          type: integer
          description: 'Размер файла, байт'
          example: 34454939
        name:
          type: string
          description: Имя файла
          example: Отчёт.pdf.sig
        modified:
          type: string
          format: date-time
          description: Время создания файла
          example: "2021-11-25T11:47:53.926Z"
        data:
          type: object
          description: Дополнительная информация по содержимому файла (метаданные)
          properties:
            checklistStatus:
              type: string
              enum:
                - 'bg-red'
                - 'bg-yellow'
                - 'bg-green'
              description: Итоговый статус чеклиста (красный/желтый/зелёный)
              example: 'bg-green'
            checklist:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ChecklistItem'
              description: Наименование (категория) файла
              example: ЭЦП
      required:
        - type
        - url
        - size
        - name


    ChecklistItem:
      type: object
      properties:
        title:
          type: string
          description: Наименование элемента чеклиста
          example: 'Дом включён в реестр аварийных домов'
        value:
          type: string
          description: Значение элемента чеклиста
          example: 'Да'
        status:
          type: string
          description: Статус элемента чеклиста
          enum:
            - 'bg-red'
            - 'bg-yellow'
            - 'bg-green'
          example: 'bg-red'
        # hide:
        #   type: boolean
        #   description: Требуется ли показывать этот элемент
        #   example: false
      required:
        - title
        - value
        - status


    OrderStatus:
      type: string
      description: >-
        Статус заказа
        
        * `queued` - Черновик заказа. Заказ находится в очереди на обработку.
        
        * `confirmation` - Проверка заказа. Уточнение параметров заказа, выбор исполнителя, согласование с заказчиком.
        
        * `pre-inspection` - Подготовка к осмотру объекта оценки. Согласование исполнителя и даты осмотра.
        
        * `inspection` - Осмотр объекта оценки.
        
        * `pre-production` - Подготовка к оценке. Передача материалов в производство.

        * `appraisal` - В работе у оценщика.
        
        * `delivery` - Отчёт готов, согласование/доставка отчёта заказчику.
        
        * `completed` - Заказ выполнен.
        
        * `onhold` - Выполнение заказа отложено.
        
        * `cancelled` - Заказ отменён.
      enum:
        - queued
        - confirmation
        - pre-inspection
        - inspection
        - pre-production
        - appraisal
        - delivery
        - completed
        - onhold
        - cancelled
      example: completed

