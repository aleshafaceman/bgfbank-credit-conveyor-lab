    Request:
      description: Запрос на экспресс-оценку
      type: object
      properties:
        _id:
          type: string
          description: ID запроса
          example: 5beafb4589515a59347a0e8f
        submitDt:
          type: string
          format: date-time
          description: Дата создания запроса
          example: '2018-11-13T17:43:07.404Z'
        status:
          type: string
          description:  >-
            Статус запроса.
            
            * `pending-auto` - Ожидание завершения автоматической верификации.
            
            * `pending-control` - Требуется экспертная верификация (причина в `control.controlReason`). Ожидание завершения экспертной верификации (до `control.deadline`).
            
            * `accepted` - Верификация завершена (стоимость в `price`).
              
            * `rejected` - Верификация завершена и отклонение расчитанной стоимости (`price`) от оценочной (`params.objPrice`) превышает пороговое значение.
            
            * `cancelled` - Запрос отменён (причина в `cancelReason`).
          enum:
            - pending-auto
            - pending-control
            - accepted
            - rejected
            - cancelled
          example: pending-control
        from:
          $ref: '#/components/schemas/UserShort'
        to:
          $ref: '#/components/schemas/OrgWithDept'
        batch:
          type: boolean
          description: Был ли этот запрос частью пакета запросов
          example: false
        expressId:
          type: string
          nullable: true
          description: Уникальный номер запроса (он же номер отчёта в ЕИСУРД/АПИКС)
          example: 181113-768
        cancelReason:
          type: string
          nullable: true
          description: Причина отмены запроса (если `status = cancelled`)
          example: Запрос отменён отправителем
        price:
          type: number
          format: float
          nullable: true
          description: >-
            Верифицированная стоимость объекта, руб, равна null, пока не будет
            закончена ручная либо автоматическая оценка.
          example: 4733967.722478794
        priceSqm:
          type: number
          format: float
          nullable: true
          description: 'Верифицированная стоимость объекта, руб/кв.м'
          example: 77606.02823735728
        objPriceSqm:
          type: number
          format: float
          nullable: true
          description: 'Исходная оценочная стоимость объекта, руб/кв.м'
          example: 82163.9344262295
        diffPercent:
          type: number
          format: float
          nullable: true
          description: Отклонение в % верифицированной стоимости от оценочной
          example: 5.873134204126397
        diffPercentAbs:
          type: number
          format: float
          nullable: true
          description: >-
            Абсолютное значение отклонения в % верифицированной стоимости от
            оценочной
          example: 5.873134204126397
        files:
          description: Заключение о стоимости и другие документы.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FileExt'
        params:
          $ref: '#/components/schemas/InputParams'
        auto:
          $ref: '#/components/schemas/VerificationResult'
        control:
          $ref: '#/components/schemas/ControlVerificationResult'
        egrn:
          $ref: '#/components/schemas/Egrn'
      required:
        - _id
        - submitDt
        - expressId
        - status
        - params
        - price
        - from
        - to

