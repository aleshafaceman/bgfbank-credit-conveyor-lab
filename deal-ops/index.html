<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>БЖФ · АРМ сделки (ОЗС / ОПЕРУ)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="deal-ops.css?v=17">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="brand-logo" src="brand/logo-on-dark.svg" alt="БЖФ Банк">
      <small>Стол сделки после комплекта КОД</small>
    </div>
    <div class="roles" role="tablist">
      <button type="button" class="role on" id="role-ozs" onclick="setRole('ozs')">ОЗС</button>
      <button type="button" class="role" id="role-operu" onclick="setRole('operu')">ОПЕРУ</button>
    </div>
    <div class="header-actions">
      <span id="officer-label"></span>
      <button type="button" onclick="resetDemo()">Сбросить сцену</button>
    </div>
  </header>

  <div class="layout">
    <aside class="inbox">
      <h2 id="inbox-title">Очередь ОЗС</h2>
      <div id="inbox-list"></div>
    </aside>

    <main class="work" id="work">
      <p class="empty" id="work-empty">Выберите сделку слева. Клиент остаётся за этим столом — во второе окно не ходим.</p>
      <div id="work-deal" class="hidden"></div>
    </main>

    <aside class="bus">
      <div class="aside-head" id="bus-head">
        <h2>Ход обмена</h2>
      </div>
      <p class="hint bus-hint">Ответы систем. Живых ФНС и ЦФТ нет — это учебный стол.</p>
      <div id="bus-list"></div>
    </aside>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h3 id="modal-title">Интеграция</h3>
      <p id="modal-lead"></p>
      <ul class="log" id="modal-log" style="list-style:none"></ul>
    </div>
  </div>

  <script src="mock.js?v=17"></script>
  <script src="deal-ops.js?v=17"></script>
</body>
</html>
