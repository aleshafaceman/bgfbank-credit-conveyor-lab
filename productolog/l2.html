<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>БЖФ · Каталог L2 — модель продуктолога</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../deal-ops/deal-ops.css?v=21">
  <link rel="stylesheet" href="productolog.css?v=15">
  <link rel="stylesheet" href="l2.css?v=1">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo" src="../deal-ops/brand/logo-on-dark.png" alt="БЖФ Банк">
      </div>
      <div class="header-tabs">
        <div class="roles arms" role="tablist" aria-label="АРМ">
          <button type="button" class="role on">Продуктолог</button>
          <button type="button" class="role" onclick="location.href='../productolog/'">Конфиг Solver</button>
        </div>
        <div class="roles" role="tablist" aria-label="Раздел">
          <button type="button" class="role on">Каталог L2</button>
        </div>
      </div>
      <div class="header-actions">
        <a class="hub-link" href="../start.html" title="Карта демо">← Карта демо</a>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="inbox">
      <h2 id="inbox-title">Опции каталога</h2>
      <div class="inbox-tools">
        <input id="l2-search" class="inbox-search" type="search" placeholder="Поиск по названию, коду, продукту">
      </div>
      <div id="inbox-list"></div>
    </aside>

    <main class="work" id="work">
      <p class="empty" id="work-empty">Выберите запись слева.</p>
      <div id="work-deal" class="hidden"></div>
    </main>

    <aside class="bus">
      <div class="aside-head" id="bus-head">
        <h2>Ход обмена</h2>
      </div>
      <p class="hint bus-hint">Учебный обмен: публикация версии и подтверждение СПР имитируются, сеть не используется.</p>
      <div id="bus-list"></div>
    </aside>
  </div>

  <script src="l2-data.js?v=1"></script>
  <script src="spec.js?v=1"></script>
  <script src="l2.js?v=1"></script>
</body>
</html>
